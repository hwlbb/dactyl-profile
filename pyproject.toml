[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dactyl-keyboard"
version = "0.1.0"
description = "A Python tool for generating Dactyl keyboard models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = ["solidpython>=0.4.8", "numpy>=1.26.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "watchdog>=3.0.0"]

[project.scripts]
dactyl = "src.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
